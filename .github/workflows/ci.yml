name: CI # Includes patched dependency audit and transactional audit-path checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: llr
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llr_inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llr -d llr_inventory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://llr:postgres@127.0.0.1:5432/llr_inventory
      API_TOKEN: test-intake-token-0123456789-abcdef
      APPROVER_TOKEN: test-approver-token-9876543210-abcdef
      ORGANIZATION_NAME: Lost Limb Riders Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax and JSON checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build production container
        run: docker build --tag llr-inventory:ci .
